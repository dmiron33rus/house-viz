spring:
  application:
    name: house-viz

  datasource:
    url: jdbc:postgresql://localhost:5432/houseviz
    username: houseviz
    password: houseviz
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate   # Flyway рулит схемой, Hibernate только проверяет
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

server:
  port: 8080
  error:
    include-message: always

logging:
  level:
    com.houseviz: DEBUG
    org.hibernate.SQL: DEBUG

app:
  jwt:
    secret: "change-me-to-a-long-random-string-min-32-bytes-for-hs256!"
    access-token-ttl: PT15M     # ISO-8601 duration, 15 минут
    issuer: house-viz